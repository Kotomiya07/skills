name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/compact-plus
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Validate marketplace and plugins
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          repository = Path.cwd()
          marketplace_path = repository / ".claude-plugin" / "marketplace.json"
          marketplace = json.loads(marketplace_path.read_text(encoding="utf-8"))
          registered_sources = set()

          for plugin in marketplace["plugins"]:
              source = repository / plugin["source"]
              manifest_path = source / ".claude-plugin" / "plugin.json"
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              assert plugin["name"] == manifest["name"], manifest_path
              assert plugin["version"] == manifest["version"], manifest_path
              assert any((source / "skills").glob("*/SKILL.md")), source
              registered_sources.add(source.resolve())

          plugin_sources = {
              path.parent.parent.resolve()
              for path in (repository / "plugins").glob("*/.claude-plugin/plugin.json")
          }
          assert registered_sources == plugin_sources, "marketplace plugin sources do not match plugins/"
          PY

      - name: Validate JSON hooks
        run: python3 -m json.tool hooks/hooks.json >/dev/null

      - name: Check Python syntax
        run: python3 -m py_compile scripts/checkpoint.py

      - name: Check bash syntax
        run: bash -n hooks/*.sh tests/*.sh

      - name: Check no tracked symlinks
        working-directory: .
        run: |
          if git ls-files -s | grep '^120000'; then
            printf '%s\n' 'Tracked symlinks are not allowed.'
            exit 1
          fi

      - name: Check state summary heading contract
        run: |
          for heading in \
            '^# Compact Prep State$' \
            '^## Goal and Definition of Done$' \
            '^## Authoritative Documents$' \
            '^## Active Plan$' \
            '^## Current Phase and Tasks$' \
            '^## TaskList Summary$' \
            '^## Session Decisions$' \
            '^## Rejected Hypotheses$' \
            '^## Constraints and Blockers$' \
            '^## Git State$' \
            '^## Pull Request State$' \
            '^## Loop State and Approval Scope$' \
            '^## Worker Topology$' \
            '^## Skills Invoked$' \
            '^## Editing Files$' \
            '^## Failed Attempts$' \
            '^## Next Deterministic Action$' \
            '^## Unverified Items$' \
            '^## Recovery Metadata$'; do
            grep -Eq "$heading" prompts/state-summary.md
          done

      - name: Test checkpoint hooks
        run: bash tests/checkpoint-hooks.sh
